<!DOCTYPE html>
<html lang="pt-BR">
<head>

</head>

                Licença anual: <strong>R$ 99,00</strong><br>
                Pix: <strong>trovaoengenharia@outlook.com</strong><br>
                <a href="https://wa.me/5534988973971" target="_blank" style="color: #60a5fa; display: block; margin-top: 10px;">Enviar comprovativo via WhatsApp</a>
            </p>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <header>
            <div class="container navbar">
                <a href="#" class="logo">Memorial Lotes Pro</a>
                <nav>
                    <button onclick="sair()" class="btn-outline" style="color: white; border: 1px solid #64748b; cursor: pointer; padding: 8px 15px; background: transparent;">Sair</button>
                </nav>
            </div>
        </header>
        <main>
            <section class="hero">
                <div class="container">
                    <h1>Sistema Liberado.</h1>
                    <p>Acesso autorizado para clientes Trovão Construtora e Consultoria LTDA.</p>
